<!doctype html>
<html lang="en">
  <head>
    <!-- Netlify injects a fixed "Powered by Netlify" badge (free-tier HUD, an iframe #nl-badge-frame) on every page; hide it everywhere -->
    <style>[data-netlify-deploy-id], a[href*="app.netlify.com/sites"], #nl-badge-frame { display: none !important; }</style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventicor</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>(function(){var l=document.querySelector('link[rel="manifest"]');if(l)l.href='/api/manifest'+location.search})();</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <meta name="description" content="Eventicor: beautiful event websites in minutes. Upload your photos, pick a template, share your day." />
  </head>
  <body>
    <div id="root"></div>
    <!-- Branded boot splash: paints before any JavaScript loads, so the app never opens on a blank white screen -->
    <div id="boot-splash" style="position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#0a0917;">
      <div style="display:grid;place-items:center;gap:18px;">
        <div style="font-family:'Playfair Display',Georgia,serif;font-size:34px;letter-spacing:.02em;color:#f4f1ea;font-weight:600;">Eventicor</div>
        <div style="width:26px;height:26px;border-radius:50%;border:2.5px solid rgba(244,241,234,.25);border-top-color:#c9a96a;animation:bootsplashspin .9s linear infinite;"></div>
      </div>
    </div>
    <style>@keyframes bootsplashspin{to{transform:rotate(360deg)}}</style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
