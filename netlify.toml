[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/iv/*"
  to = "/.netlify/functions/iv-meta"
  status = 200

[[redirects]]
  from = "/manifest.webmanifest"
  to = "/api/manifest"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
