name: Daily sweeps (retention + reminders)

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Retention cleanup (expired sample and trial apps, files included)
        run: curl -fsS "https://eventicor.name.ng/api/retention-cron?key=8c739c480c565fac44fd4fe421d76083" || true

      - name: Customer reminder sweep (restored: its old workflow had gone missing)
        run: curl -fsS "https://eventicor.name.ng/api/reminders-cron?key=8ae61bdd82781d4f2e1f19dc61b1f0c4" || true
